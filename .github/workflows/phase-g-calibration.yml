name: Phase G Village Bias Calibration

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build calibration layer
        run: python scripts/build-village-bias-calibration.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/village-bias-calibration.json"))
          assert p["version"] == 1
          assert "districtPriors" in p
          assert "villageOverrides" in p
          print("Phase G calibration valid:", len(p["districtPriors"]), "district priors")
          PY
      - name: Commit calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/village-bias-calibration.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Phase G village bias calibration"
          git push
