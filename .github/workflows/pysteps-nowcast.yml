name: pySTEPS Radar Nowcast

on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'

permissions:
  contents: write

jobs:
  nowcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pySTEPS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pysteps.txt

      - name: Check for quantitative radar frames
        id: radar
        run: |
          mkdir -p radar-input
          count=$(find radar-input -type f \( -name '*.h5' -o -name '*.hdf5' -o -name '*.nc' -o -name '*.tif' -o -name '*.tiff' \) | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count quantitative radar frames."

      - name: Run pySTEPS
        if: steps.radar.outputs.count >= 3
        run: |
          python scripts/pysteps_nowcast.py             --input-dir radar-input             --output data/pysteps-nowcast.json             --lead-minutes 120             --timestep 10

      - name: Keep waiting state when radar input is absent
        if: steps.radar.outputs.count < 3
        run: |
          cat > data/pysteps-nowcast.json <<'JSON'
          {
            "engine": "pySTEPS",
            "captured_at": null,
            "summary": [],
            "status": "waiting_for_quantitative_radar",
            "note": "At least three consecutive quantitative radar frames are required."
          }
          JSON

      - name: Commit nowcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pysteps-nowcast.json
          git diff --cached --quiet || git commit -m "chore: update pySTEPS nowcast"
          git push
