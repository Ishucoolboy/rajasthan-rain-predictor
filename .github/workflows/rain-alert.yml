name: Rajasthan Rain WhatsApp Alerts

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours: 00:15, 03:15, 06:15, ... UTC
    # = 05:45, 08:45, 11:45, ... IST
    - cron: "15 */3 * * *"

permissions:
  contents: write

concurrency:
  group: rajasthan-rain-alert
  cancel-in-progress: true

jobs:
  rainfall-alert:
    runs-on: ubuntu-latest

    env:
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
      WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
      WHATSAPP_TEMPLATE_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_LANGUAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rainfall alert engine
        run: |
          python rain-alert-engine.py

      - name: Commit alert state
        run: |
          git config user.name "Rajasthan Rain Predictor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rain_alert_state.json
          if git diff --cached --quiet; then
            echo "No alert-state changes."
          else
            git commit -m "Update rainfall alert state"
            git push
          fi
