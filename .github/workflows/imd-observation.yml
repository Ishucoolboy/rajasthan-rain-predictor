name: IMD Observation Collector

on:
  schedule:
    # 09:00 AM IST = 03:30 UTC
    # Runs after IMD's daily rainfall reporting period.
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-imd-observations:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # CHECKOUT REPOSITORY
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # SETUP PYTHON
      # ----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------
      # INSTALL DEPENDENCIES
      # ----------------------------------------------------

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.32.0"

      # ----------------------------------------------------
      # RUN IMD COLLECTOR
      # ----------------------------------------------------

      - name: Collect IMD observations
        run: |
          python imd-observation-collector.py

      # ----------------------------------------------------
      # SHOW RESULT
      # ----------------------------------------------------

      - name: Show generated observation file
        run: |
          echo "=============================================="
          echo "IMD OBSERVATION FILE"
          echo "=============================================="

          if [ -f data/imd_observations.json ]; then
            cat data/imd_observations.json
          else
            echo "No observation file was generated."
          fi

      # ----------------------------------------------------
      # COMMIT UPDATED DATA
      # ----------------------------------------------------

      - name: Commit IMD observation data
        run: |

          git config user.name "Rajasthan Rain Predictor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/imd_observations.json

          if git diff --cached --quiet; then
            echo "No IMD observation changes to commit."
          else

            git commit -m "Update IMD rainfall observations"

            git push

          fi
