name: Rajasthan Village Registry Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * 1"

permissions:
  contents: write

concurrency:
  group: rajasthan-village-registry
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build village registry
        run: python scripts/build-rajasthan-village-registry.py

      - name: Validate registry
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/rajasthan-village-registry.json", encoding="utf-8"))
          assert p["coordinate_records"] > 40000, p["coordinate_records"]
          assert len(p["villages"]) == p["coordinate_records"]
          print("Village records:", p["coordinate_records"])
          print("Complete coverage verified:", p["complete_coverage_verified"])
          PY

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rajasthan-village-registry.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Rajasthan village registry"
          git push
