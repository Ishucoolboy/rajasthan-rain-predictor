name: Forecast and observation collector
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/snapshot.mjs
        env:
          RAINBOW_API_KEY: ${{ secrets.RAINBOW_API_KEY }}
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-snapshots.json data/imd-rainfall-latest.json data/rainbow-nowcast.json
          git diff --cached --quiet || git commit -m "chore: collect forecast and observation data"
          git push
